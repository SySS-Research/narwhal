cpu:
  type: cortex-m3
  cpuid: 0x41c23
  # vtor: 0x08000000
  vtor: 0x08001000

memorymap:
  - type: mmio
    start: 0x40000000
    end: 0x5FFFFFFF
  # SRAM
  - type: ram
    start: 0x20000000
    end: 0x2000FFFF
  # Flash
  - type: ram # HMIP bootloader writes to flash
    start: 0x08000000
    end: 0x0803FFFF

loaders:
  - id: emu.loader.bin
    address: 0x08000000
    file: "../boot0.bin"
  - id: emu.loader.bin
    address: 0x0803e000
    file: "../config0.bin"
  - id: emu.loader.srec
    file: "../HMIP-HAP-JS1-local_bootloader_update.srec"
  - id: emu.loader.srec
    file: "../HMIP-HAP-JS1-web_bootloader_update.srec"
  - id: emu.loader.srec
    file: "../HMIP-HAP-JS1-application_update.srec"

peripherals:
  # USART1
  - id: emu.peripherals.stm32f1xx.usart
    start: 0x40013800
    end: 0x40013BFF
    identifier: "USART1"
  # DMA1
  - id: emu.peripherals.stm32f1xx.dma
    start: 0x40020000
    end: 0x400203FF
  # ADC1
  - id: emu.peripherals.stm32f1xx.adc
    start: 0x40012400
    end: 0x400127FF
  # ETH
  - id: emu.peripherals.stm32f1xx.eth
    start: 0x40028000
    end: 0x40029FFF
    identifier: "ETH"
  # GPIOC
  - id: emu.peripherals.stm32f1xx.gpio
    start: 0x40011000
    end: 0x400113FF
    identifier: "GPIOC"
  # UART5
  - id: emu.peripherals.stm32f1xx.usart
    start: 0x40005000
    end: 0x400053FF
    identifier: "UART5"
  # TIM2
  - id: emu.peripherals.stm32f1xx.tim
    start: 0x40000000
    end: 0x400003FF

devices:
  - id: emu.devices.console
    identifier: "console"
  - id: emu.devices.phy
    identifier: "phy"
  - id: emu.py.devices.toggle
    identifier: "link"
  - id: emu.py.devices.toggle
    identifier: "button"
    low_active: true
  - id: emu.py.devices.hmip_coproc
    identifier: "coproc"

connectors:
  - from:
      identifier: "USART1"
      port: "tx"
    to:
      identifier: "console"
      port: "rx"
  - from:
      identifier: "link"
      port: "output"
    to:
      identifier: "phy"
      port: "link"
  - from:
      identifier: "ETH"
      port: "smi"
    to:
      identifier: "phy"
      port: "smi"
  - from:
      identifier: "ETH"
      port: "tx"
    to:
      identifier: "phy"
      port: "tx"
  - from:
      identifier: "phy"
      port: "rx"
    to:
      identifier: "ETH"
      port: "rx"
  - from:
      identifier: "button"
      port: "output"
    to:
      identifier: "GPIOC"
      port: "pin0"
  - from:
      identifier: "UART5"
      port: "tx"
    to:
      identifier: "coproc"
      port: "rx"
  - from:
      identifier: "coproc"
      port: "tx"
    to:
      identifier: "UART5"
      port: "rx"
