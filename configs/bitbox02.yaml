    start: 0x40001000
    end: 0x400013FF
  - id: emu.peripherals.samd5x.sercom
    start: 0x41014000
    end: 0x410143FF
  - id: emu.peripherals.samd5x.trng
    start: 0x42002800
    end: 0x42002823

